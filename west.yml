# Zephyr T2 Freestanding Application Template - West Manifest
# This file defines the application workspace where this repository
# is the manifest repository and brings in Zephyr as a dependency.

manifest:
  version: "0.13"

  # This repository is the manifest repository (application-centric)
  self:
    path: .

  # Remote repositories
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  # Projects to fetch and manage
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # Pin to specific version for reproducible builds
      # Change to 'main' for latest, or specific tag like 'v3.7.0'
      revision: v3.7.0
      import:
        # Import Zephyr's own west manifest which includes HALs, modules, etc.
        name-allowlist:
          - cmsis
          - hal_atmel
          - hal_espressif
          - hal_nordic
          - hal_nxp
          - hal_st
          - hal_stm32
          - hal_ti
          - mbedtls
          - mcuboot
          - picolibc
          - segger
          - tinycrypt
          - trusted-firmware-m
          - tf-m-tests
          - psa-arch-tests

    # Add more projects here as needed
    # Example:
    # - name: my-custom-module
    #   url: https://github.com/myorg/my-custom-module
    #   revision: main
    #   path: modules/my-custom-module
